name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          # Runner images change their preinstalled simulators, so pick any
          # available iPhone instead of hardcoding a model name.
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          if [ -z "$UDID" ]; then
            echo "no iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          xcodebuild test \
            -project runboard/runboard.xcodeproj \
            -scheme runboard \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:runboardTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            'ASSETCATALOG_COMPILER_APPICON_NAME='
